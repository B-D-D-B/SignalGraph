name: C# Build

on:
  push:
    branches:
      - main_publish
    paths:
      - 'Src/CSharp/**'
      - '.github/workflows/csharp-build.yml'
  pull_request:
    branches:
      - main_publish
    paths:
      - 'Src/CSharp/**'
      - '.github/workflows/csharp-build.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build and package
    if: github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main_publish'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: Src/CSharp

    env:
      DOTNET_NOLOGO: 'true'
      DOTNET_CLI_TELEMETRY_OPTOUT: 'true'

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore SignalGraph.csproj

      - name: Build Release
        run: dotnet build SignalGraph.csproj --configuration Release --no-restore -p:GeneratePackageOnBuild=false -p:ContinuousIntegrationBuild=true

      - name: Create NuGet packages
        run: dotnet pack SignalGraph.csproj --configuration Release --no-build --output bin/Release/packages

      - name: Upload NuGet packages
        uses: actions/upload-artifact@v4
        with:
          name: SignalGraph-nuget-${{ github.run_number }}
          path: |
            Src/CSharp/bin/Release/packages/*.nupkg
            Src/CSharp/bin/Release/packages/*.snupkg
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish to NuGet.org
    needs: build
    if: github.ref == 'refs/heads/main_publish' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Download NuGet packages
        uses: actions/download-artifact@v4
        with:
          name: SignalGraph-nuget-${{ github.run_number }}
          path: packages

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Check NuGet configuration
        env:
          NUGET_USER: ${{ vars.NUGET_USER }}
        run: |
          if [ -z "$NUGET_USER" ]; then
            echo "::error::Set the NUGET_USER repository Actions variable to your NuGet.org profile username."
            exit 1
          fi

      - name: Authenticate to NuGet.org
        uses: NuGet/login@v1
        id: nuget-login
        with:
          user: ${{ vars.NUGET_USER }}

      - name: Publish NuGet packages
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
        run: >-
          dotnet nuget push "packages/*.nupkg"
          --api-key "$NUGET_API_KEY"
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate
