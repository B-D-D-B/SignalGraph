name: C# Build

on:
  push:
    branches:
      - main_publish
    paths:
      - 'Src/CSharp/**'
      - '.github/workflows/csharp-build.yml'
  pull_request:
    branches:
      - main_publish
    paths:
      - 'Src/CSharp/**'
      - '.github/workflows/csharp-build.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and package
    if: github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main_publish'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: Src/CSharp

    env:
      DOTNET_NOLOGO: 'true'
      DOTNET_CLI_TELEMETRY_OPTOUT: 'true'

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore SignalGraph.csproj

      - name: Build Release
        run: dotnet build SignalGraph.csproj --configuration Release --no-restore -p:GeneratePackageOnBuild=false -p:ContinuousIntegrationBuild=true

      - name: Create NuGet packages
        run: dotnet pack SignalGraph.csproj --configuration Release --no-build --output bin/Release/packages

      - name: Upload NuGet packages
        uses: actions/upload-artifact@v4
        with:
          name: SignalGraph-nuget-${{ github.run_number }}
          path: |
            Src/CSharp/bin/Release/packages/*.nupkg
            Src/CSharp/bin/Release/packages/*.snupkg
          if-no-files-found: error
          retention-days: 14
